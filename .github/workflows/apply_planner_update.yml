name: Apply planner update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Rebuild update archive
        shell: bash
        run: |
          cat .update/part_*.b64 > /tmp/update.b64
          base64 --decode /tmp/update.b64 > /tmp/update.tar.xz
          tar -xJf /tmp/update.tar.xz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Update README test count
        shell: bash
        run: |
          sed -i 's/47 testes automatizados/49 testes automatizados/g' README.md
          sed -i 's/47 testes/49 testes/g' README.md

      - name: Commit corrected planner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INTEGRACAO_UFABC_NEXT.md MELHORIAS_IMPLEMENTADAS.md RELATORIO_DE_VALIDACAO.md app.py \
            dados/curriculo_engenharia_materiais_2017.json \
            dados/curriculos/bcc_2017.json \
            dados/curriculos/bcc_2023.json \
            dados/curriculos/bcd_2023.json \
            dados/curriculos/bct_2015.json \
            dados/curriculos/ei_2017.json \
            dados/curriculos/ei_2023.json \
            dados_fontes/catalogo_recomendacoes_2025_2026.json \
            ferramentas/gerar_base_curricular.py \
            ferramentas/gerar_curriculos_multicurso.py \
            planejador/avaliacoes_docentes.py \
            planejador/relatorio.py \
            tests/test_regras.py \
            README.md
          git commit -m "Improve teacher ratings and catalog recommendations"
          git push origin HEAD:main
